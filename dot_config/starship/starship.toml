palette = "eight-hundred"

format = """
[░▒▓](segment1)\
[  ](bg:segment1 fg:icon_text)\
[](bg:directory fg:segment1)\
$directory\
[](fg:directory bg:git)\
$git_branch\
$git_status\
[](fg:git bg:languages)\
$nodejs\
$rust\
$golang\
$php\
[](fg:languages bg:time)\
$time\
[ ](fg:time)\
\n$character"""

[directory]
style = "fg:directory_text bg:directory"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:git"
format = '[[ $symbol $branch ](fg:accent bg:git)]($style)'

[git_status]
style = "bg:git"
format = '[[($all_status$ahead_behind )](fg:accent bg:git)]($style)'

[nodejs]
symbol = ""
style = "bg:languages"
format = '[[ $symbol ($version) ](fg:accent bg:languages)]($style)'

[rust]
symbol = ""
style = "bg:languages"
format = '[[ $symbol ($version) ](fg:accent bg:languages)]($style)'

[golang]
symbol = ""
style = "bg:languages"
format = '[[ $symbol ($version) ](fg:accent bg:languages)]($style)'

[php]
symbol = ""
style = "bg:languages"
format = '[[ $symbol ($version) ](fg:accent bg:languages)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:time"
format = '[[  $time ](fg:time_text bg:time)]($style)'

[palettes.bg-palette]
segment1 = "#C4B5A0"       # base04
icon_text = "#0A0A0B"      # base00
directory = "#3F4E7A"      # base0D
directory_text = "#FAFAF8" # base05
accent = "#4DB8C4"         # base0C
git = "#4A4A4D"            # base02
languages = "#3B3B3D"      # between base02 and base01
time = "#2C2C2E"           # base01
time_text = "#C4B5A0"      # base04

[palettes.eight-hundred]
segment1 = "#B2C0C9"       # base04
icon_text = "#101C28"      # base00
directory = "#8BB9EA"      # base0D
directory_text = "#101C28" # base00
accent = "#8BB9EA"         # base0D
git = "#395468"            # base02
languages = "#2A4052"      # between base02 and base01
time = "#1C2D3C"           # base01
time_text = "#B2C0C9"      # base04
